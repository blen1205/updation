<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Digital Evangelization Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="min-h-screen flex flex-col justify-between font-sans antialiased text-gray-800 bg-gradient-to-br from-[#0a1633] via-[#14296b] to-[#0a1633]">

    <!-- ANIMATED BACKGROUND: lumulutang na mga libro (walang GIF file, canvas lang) -->
    <canvas id="bg-books" class="fixed inset-0 w-full h-full z-0 pointer-events-none" aria-hidden="true"></canvas>

    <!-- TOP BLUE HEADER BAR -->
    <header class="relative z-10 bg-[#2563eb]/90 backdrop-blur text-white py-3 px-6 shadow-sm">
      <h1 class="text-lg font-bold tracking-wide">Admin Login</h1>
    </header>

    <!-- MAIN CENTER CONTAINER -->
    <main class="relative z-10 flex-1 flex items-center justify-center p-4">
      <div class="bg-white w-full max-w-[420px] rounded-2xl shadow-2xl overflow-hidden relative border border-white/20">

        <div class="h-1.5 w-full bg-gradient-to-r from-[#2563eb] via-[#059669] to-[#10b981]"></div>

        <div class="p-8 space-y-6">
          <div class="text-center space-y-3">
            <img src="logo2.png" alt="Digital Evangelization Network" class="h-16 mx-auto object-contain" />
            <h2 class="text-xl font-bold text-[#2563eb]">Admin Portal</h2>
            <p class="text-xs text-gray-500 font-medium">Staff access only. Please enter your credentials below.</p>
          </div>

          <form id="login-form" class="space-y-4">
            <div>
              <label for="username" class="block text-[11px] font-extrabold text-gray-600 uppercase tracking-wider mb-1.5">USERNAME</label>
              <input type="text" id="username" placeholder="Enter admin username" required
                class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
            </div>

            <div>
              <label for="password" class="block text-[11px] font-extrabold text-gray-600 uppercase tracking-wider mb-1.5">PASSWORD</label>
              <div class="relative">
                <input type="password" id="password" placeholder="••••••••" required
                  class="w-full px-3.5 py-2.5 pr-10 rounded-lg border border-gray-300 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" />
                <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none text-sm">
                  <i class="fa-regular fa-eye"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="w-full bg-[#2563eb] hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md hover:shadow-lg transition duration-200 text-sm flex items-center justify-center space-x-2 mt-2">
              <i class="fa-solid fa-key text-amber-300 text-xs"></i>
              <span>Sign In</span>
            </button>
          </form>

          <div class="pt-4 border-t border-gray-100 text-center text-[11px] text-gray-400 space-y-0.5">
            <div>Unauthorized access is strictly prohibited.</div>
            <div class="font-semibold text-gray-500">Digital Evangelization Network Philippines</div>
          </div>
        </div>
      </div>
    </main>

    <footer class="relative z-10 py-4 text-center text-xs text-blue-200/70">
      © 2026 Digital Evangelization Network • All rights reserved
    </footer>

    <script>
      // ---------- FLOATING BOOKS BACKGROUND ----------
      (function () {
        const cv = document.getElementById("bg-books");
        const ctx = cv.getContext("2d");
        // Kulay ng DevNet logo: blue + green + lime
        const COLORS = ["#2563eb", "#1e3a8a", "#3b82f6", "#4f8f14", "#8cc63f", "#0f766e"];
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let W, H, books = [];

        const rnd = (a, b) => a + Math.random() * (b - a);

        function make(initial) {
          const z = Math.random();              // 0 = malayo (maliit, mabagal), 1 = malapit
          const s = 26 + z * 54;                // laki ng libro
          return {
            x: rnd(0, W), y: initial ? rnd(0, H) : H + s * 1.5,
            s, vy: 0.25 + z * 0.7,              // bilis pataas
            sway: rnd(0.4, 1.2), ph: rnd(0, 6.28),
            r: rnd(0, 6.28), vr: rnd(-0.004, 0.004),
            c: COLORS[(Math.random() * COLORS.length) | 0],
            a: 0.18 + z * 0.4,                  // linaw
            cross: Math.random() < 0.3          // may krus ang ilang libro
          };
        }

        function resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          W = window.innerWidth; H = window.innerHeight;
          cv.width = W * dpr; cv.height = H * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          const count = Math.max(14, Math.min(40, Math.round((W * H) / 38000))); // dami ng libro
          books = Array.from({ length: count }, () => make(true));
        }

        function rr(x, y, w, h, r) {
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
        }

        function drawBook(b, t) {
          const w = b.s * 0.72, h = b.s;
          const x = b.x + Math.sin(t * 0.0006 * b.sway + b.ph) * 18;
          ctx.save();
          ctx.globalAlpha = b.a;
          ctx.translate(x, b.y);
          ctx.rotate(b.r);
          // pages
          ctx.fillStyle = "#e2e8f0"; rr(-w / 2 + b.s * 0.05, -h / 2 + b.s * 0.04, w, h, 3); ctx.fill();
          // cover
          ctx.fillStyle = b.c; rr(-w / 2, -h / 2, w, h, 3); ctx.fill();
          // spine
          ctx.save(); rr(-w / 2, -h / 2, w, h, 3); ctx.clip();
          ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(-w / 2, -h / 2, w * 0.14, h);
          ctx.restore();
          // title bands
          ctx.fillStyle = "rgba(255,255,255,.55)";
          ctx.fillRect(-w / 2 + w * 0.28, -h * 0.30, w * 0.55, h * 0.07);
          ctx.fillRect(-w / 2 + w * 0.28, -h * 0.18, w * 0.40, h * 0.04);
          if (b.cross) {
            const cx = -w / 2 + w * 0.14 + (w * 0.86) / 2;
            ctx.fillRect(cx - w * 0.03, h * 0.02, w * 0.06, h * 0.26);
            ctx.fillRect(cx - w * 0.11, h * 0.09, w * 0.22, w * 0.06);
          }
          ctx.restore();
        }

        function frame(t) {
          ctx.clearRect(0, 0, W, H);
          for (let i = 0; i < books.length; i++) {
            const b = books[i];
            if (!reduceMotion) { b.y -= b.vy; b.r += b.vr; }
            if (b.y < -b.s * 1.5) books[i] = make(false);
            drawBook(books[i], t);
          }
          if (!reduceMotion) requestAnimationFrame(frame);
        }

        window.addEventListener("resize", resize);
        resize();
        requestAnimationFrame(frame);
      })();
    </script>

    <script src="admin.js"></script>
  </body>
</html>
